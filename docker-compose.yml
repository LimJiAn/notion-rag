services:
  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      DATA_DIR: ${DATA_DIR:-/app/data}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_VERSION: ${NOTION_VERSION:-2022-06-28}
      NOTION_ROOT_PAGE_IDS: ${NOTION_ROOT_PAGE_IDS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_GENERATION_MODEL: ${GEMINI_GENERATION_MODEL:-gemini-2.5-flash}
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      TOP_K: ${TOP_K:-6}
      SIMILARITY_CUTOFF: ${SIMILARITY_CUTOFF:-0.65}
      WORKER_COUNT: ${WORKER_COUNT:-4}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-60s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
