services:
  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      DATA_DIR: ${DATA_DIR:-/app/data}
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_VERSION: ${NOTION_VERSION:-2026-03-11}
      NOTION_ROOT_PAGE_IDS: ${NOTION_ROOT_PAGE_IDS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      GEMINI_GENERATION_MODEL: ${GEMINI_GENERATION_MODEL:-gemini-2.5-flash}
      VECTOR_STORE: ${VECTOR_STORE:-weaviate}
      WEAVIATE_URL: ${WEAVIATE_INTERNAL_URL:-http://weaviate:8080}
      WEAVIATE_CLASS_NAME: ${WEAVIATE_CLASS_NAME:-NotionChunk}
      CHUNK_SIZE: ${CHUNK_SIZE:-1000}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-150}
      TOP_K: ${TOP_K:-6}
      SIMILARITY_CUTOFF: ${SIMILARITY_CUTOFF:-0.65}
      WORKER_COUNT: ${WORKER_COUNT:-4}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-60s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    volumes:
      - backend_data:/app/data
    depends_on:
      - weaviate
    restart: unless-stopped

  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.37.2
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --scheme
      - http
    ports:
      - "${WEAVIATE_HTTP_PORT:-8081}:8080"
      - "${WEAVIATE_GRPC_PORT:-50051}:50051"
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      CLUSTER_HOSTNAME: node1
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
  weaviate_data:
